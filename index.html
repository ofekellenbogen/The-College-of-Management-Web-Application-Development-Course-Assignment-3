<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק ללימוד HTTP ו-REST API (מטלה 3)</title>
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <!-- Marked.js (Markdown Parser) & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      margin: 0;
      padding: 2rem 1rem;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      direction: rtl;
      text-align: right;
    }
    .markdown-body pre, 
    .markdown-body code {
      direction: ltr;
      text-align: left;
    }
    .markdown-body a {
      color: #58a6ff;
    }
    .loading {
      text-align: center;
      color: #8b949e;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <article id="content" class="markdown-body">
    <div class="loading">טוען את תוכן ה-README.md...</div>
  </article>

  <script>
    // Configure Marked with syntax highlighting
    marked.setOptions({
      highlight: function(code, lang) {
        const language = highlight.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      gfm: true,
      breaks: true
    });

    // Fetch README.md dynamically and render it directly
    fetch('README.md')
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.text();
      })
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <h2>שגיאה בטעינת הקובץ README.md</h2>
          <p>${err.message}</p>
        `;
      });
  </script>
</body>
</html>
